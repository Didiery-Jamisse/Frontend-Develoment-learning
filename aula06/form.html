<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Feedback Form</title>
</head>
<body>

    <header>
        <h1>Hotel Feedback Form</h1>
    <p>Thank you for staying with us. Please provide feedback on your recent stay.</p>
    </header>
    <main>
        <form method="post" action="">
            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullName">Name(Required):</label>
                <input type="text" id="fullName" name="name" placeholder="e.g., John Doe" size="40" required>

                <label for="email">Email(Required):</label>
                <input type="email" id="email" name="email" placeholder="e.g., example@email.com" size="40" required >

                <label for="age">Age(Required):</label>
                <input type="number" id="age" name="age" min="8" max="100" required>
            </fieldset>
            <fieldset>
                <legend>Was this your first time in our Hotel?</legend>

                <input type="radio" id="yesOption" name="hotelStay" value="yes" >
                <label for="yesOption">Yes</label>
                <!-- This 2 inputs must have the same name to work in sinchrounism-->
                <input type="radio" id="noOption" name="hotelStay" value="no">
                <label for="noOption">No</label>

            </fieldset>
            <fieldset>
                <legend>Why did you choose to stay at our hotel? (check all the apply)</legend>

                <input type="checkbox" id="media" name="choice" value="media">
                <label for="media">Social Media Ads</label>

                <input type="checkbox" id="price" name="choice" value="price">
                <label for="price">Price</label>

                                <!-- This 2 inputs must have the same name to work in sinchrounism-->

                <input type="checkbox" id="recommendation" name="choice" value="recommendation">
                <label for="recommendation">Personal Recommendation </label>

                <input type="checkbox" checked id="reputation" name="choice" value="reputation">
                <label for="reputation">Reputation</label>

                <input type="checkbox" id="location" name="choice" value="location">
                <label for="location">Location</label>
            </fieldset>
            <fieldset>
                <legend>Ratings</legend>

                <label for="sevice">How was the service?</label>
                <select name="services" id="service">
                     <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="bad">Bad</option>
                </select>

                <label for="food">How was the Food?</label>
                <select name="food" id="food">
                     <option value="excellent">Excellent</option>
                    <option value="good" selected>Good</option>
                    <option value="bad">Bad</option>
                </select>
            </fieldset>
            <div>
                <label for="comment">Others Comments?</label>
                <textarea name="Comment" id="comment" rows="10" cols="50"></textarea>
                <button type="submit">Submmit comment</button>
            </div>
        </form>
    </main>
</body>
</html
