<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="with=device-width, initial-scale=1.0">
        <title>Audio and Video player</title>
    </head>
    <body>
        <h1>Audio & Video Player</h1>
        <section>
            <h2>Map method explaining video</h2>
            <video controls loop muted width="640" > <!-- we cna define a height but here the broswer will adjust itself -->
                <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4" >
            </video>
        </section>
        <!--Contrils atribte is used to show on the page the video and audio player-->
        <section>
            <h2>Azagaia - No ano da fome Music</h2>
            <audio controls muted loop>
                <source  src="./Azagaia-No-Ano-da-Fome.mp3" type="audio/mp3" >
            </audio>
        </section>
    </body>
</html>
