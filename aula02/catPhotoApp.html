<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cat Photo App exercise</title>
    </head>
    <body>
        <main>
            <h1>Cat Photo APP</h1>
            <section>
                <h2>Cat photos</h2>
                <p>Everyone loves <a href="https://cdn.freecodecamp.org/curriculum/cat-photo-app/running-cats.jpg" target="_blank">cute cats</a> online!</p>
                <p>See more <a href="https://freecatphotoapp.com" target="_blank">cat photos</a> in our gallery.</p>
                <a href="https://freecatphotoapp.com" target="_blank"><img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" alt="Cat lying."></a>
            </section>
            <section>
                <h2>Cats Lists</h2>
                <h3>Things cats love:</h3>
                <ul>
                    <li>Catnip</li>
                    <li>Laser pointers</li>
                    <li>Lasanga</li>
                </ul>
                <figure>
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/lasagna.jpg" alt="A plate of lasanga.">
                    <figcaption>Cats <em>love</em> lasanga.</figcaption>
                </figure>
            </section>
            <section>
                <h2>Top 3 things cats hate:</h2>
                <ol>
                    <li>Flea treatment</li>
                    <li>Thunder</li>
                    <li>Others cats</li>
                </ol>
                <figure>
                    <img src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/cats.jpg" alt="Two cats lying in a sofa.">
                    <figcaption>Cats <strong>hate</strong> others cats.</figcaption>
                </figure>
            </section>
        </main>
        <footer>
            <!-- Added paragraph for more consistence of the code and helpin de SEO-->
            <p>
                No Copyright - <a href="https://www.freecodecamp.org" target="_blank">freeCodeCamp.org</a>
            </p>
        </footer>
    </body>
</html>
